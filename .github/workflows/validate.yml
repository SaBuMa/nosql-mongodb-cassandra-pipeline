name: Validate data and answers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

      - name: Recompute answers, reconcile and profile the data
        run: python validation/validate.py --summary "$GITHUB_STEP_SUMMARY"
